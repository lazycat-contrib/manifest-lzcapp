params:
  - id: better_auth_secret
    type: secret
    name: "Better Auth Secret"
    description: "Secret key for authentication (generate with: openssl rand -hex 32)"
    default_value: "$random(len=32)"
    optional: false

  - id: ollama_host
    type: string
    name: "Ollama Host"
    description: "Ollama instance URL (e.g., http://your-ollama:11434). Leave empty if not using Ollama."
    default_value: ""
    optional: true

  - id: email_provider
    type: string
    name: "Email Provider"
    description: "Email provider for notifications and verification (resend, mailgun, sendgrid). Leave empty to disable email."
    default_value: ""
    optional: true

  - id: email_api_key
    type: secret
    name: "Email API Key"
    description: "API key for the email provider. Required if email_provider is set."
    default_value: ""
    optional: true

  - id: email_domain
    type: string
    name: "Email Domain"
    description: "Domain for sending emails. Required if email_provider is set."
    default_value: ""
    optional: true

  - id: email_from
    type: string
    name: "Email From Address"
    description: "Sender email address. Required if email_provider is set."
    default_value: ""
    optional: true

  - id: google_client_id
    type: string
    name: "Google OAuth Client ID"
    description: "Google OAuth client ID for Google login. Leave empty to disable Google OAuth."
    default_value: ""
    optional: true

  - id: google_client_secret
    type: secret
    name: "Google OAuth Client Secret"
    description: "Google OAuth client secret. Required if google_client_id is set."
    default_value: ""
    optional: true

  - id: github_client_id
    type: string
    name: "GitHub OAuth Client ID"
    description: "GitHub OAuth client ID for GitHub login. Leave empty to disable GitHub OAuth."
    default_value: ""
    optional: true

  - id: github_client_secret
    type: secret
    name: "GitHub OAuth Client Secret"
    description: "GitHub OAuth client secret. Required if github_client_id is set."
    default_value: ""
    optional: true

  - id: discord_client_id
    type: string
    name: "Discord OAuth Client ID"
    description: "Discord OAuth client ID for Discord login. Leave empty to disable Discord OAuth."
    default_value: ""
    optional: true

  - id: discord_client_secret
    type: secret
    name: "Discord OAuth Client Secret"
    description: "Discord OAuth client secret. Required if discord_client_id is set."
    default_value: ""
    optional: true

