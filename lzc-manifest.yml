application:
  subdomain: manifest
  upstreams:
    - location: /
      backend: http://manifest:3001/
  public_path:
    - /
  injects:
    # request 阶段：捕获注册和登录请求
    - id: capture-credentials
      auth_required: false
      on: request
      when:
        - /api/auth/sign-up
        - /api/auth/sign-in
      do: |
        const method = String(ctx.request.method || "").toUpperCase();
        if (method !== "POST") return;

        let payload = null;
        try {
          payload = ctx.body.getJSON();
        } catch {
          payload = null;
        }
        if (!payload || typeof payload !== "object") return;

        const pickString = (...values) => values.find((v) => typeof v === "string" && v.length > 0) ?? "";

        const name = pickString(payload.name, payload.Name);
        const email = pickString(payload.email, payload.Email);
        const password = pickString(payload.password, payload.Password);

        if (name) ctx.flow.set("manifest_pending_name", name);
        if (email) ctx.flow.set("manifest_pending_email", email);
        if (password) ctx.flow.set("manifest_pending_password", password);

    # response 阶段：成功后持久化
    - id: commit-credentials
      auth_required: false
      on: response
      when:
        - /api/auth/sign-up/email
        - /api/auth/sign-in/email
      do: |
        if (ctx.status < 200 || ctx.status >= 300) return;

        const name = ctx.flow.get("manifest_pending_name");
        const email = ctx.flow.get("manifest_pending_email");
        const password = ctx.flow.get("manifest_pending_password");

        if (typeof name === "string" && name.length > 0) {
          ctx.persist.set("manifest.name", name);
        }
        if (typeof email === "string" && email.length > 0) {
          ctx.persist.set("manifest.email", email);
        }
        if (typeof password === "string" && password.length > 0) {
          ctx.persist.set("manifest.password", password);
        }

    # browser 阶段：注册页自动填充
    - id: register-autofill
      when:
        - /register
      do:
        - src: builtin://simple-inject-password
          params:
            user:
              $persist: manifest.email
            password:
              $persist: manifest.password
            userKeywords:
              - email
            passwordKeywords:
              - password
            autoSubmit: false

    # browser 阶段：登录页自动填充
    - id: login-autofill
      when:
        - /
        - /login
      do:
        - src: builtin://simple-inject-password
          params:
            user:
              $persist: manifest.email
            password:
              $persist: manifest.password
            autoSubmit: false

services:
  manifest:
    # manifestdotbuild/manifest:5.47.0
    image: registry.lazycat.cloud/czyt/manifestdotbuild/manifest:5ae4b31a4804a09d
    environment:
      - DATABASE_URL=postgresql://manifest:manifest@postgres:5432/manifest
      - BETTER_AUTH_SECRET={{.U.better_auth_secret}}
      - BETTER_AUTH_URL=https://{{.S.AppDomain}}
      - OLLAMA_HOST={{.U.ollama_host}}
      - SEED_DATA=false
      - NODE_ENV=production
      - AUTO_MIGRATE=true
      - EMAIL_PROVIDER={{.U.email_provider}}
      - EMAIL_API_KEY={{.U.email_api_key}}
      - EMAIL_DOMAIN={{.U.email_domain}}
      - EMAIL_FROM={{.U.email_from}}
      - GOOGLE_CLIENT_ID={{.U.google_client_id}}
      - GOOGLE_CLIENT_SECRET={{.U.google_client_secret}}
      - GITHUB_CLIENT_ID={{.U.github_client_id}}
      - GITHUB_CLIENT_SECRET={{.U.github_client_secret}}
      - DISCORD_CLIENT_ID={{.U.discord_client_id}}
      - DISCORD_CLIENT_SECRET={{.U.discord_client_secret}}
    depends_on:
      - postgres
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:3001/api/v1/health || exit 1
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
    tmpfs:
      - /tmp

  postgres:
    image: registry.lazycat.cloud/czyt/library/postgres:4ca568308ea2f6a8
    environment:
      - POSTGRES_USER=manifest
      - POSTGRES_PASSWORD=manifest
      - POSTGRES_DB=manifest
    binds:
      - /lzcapp/var/pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U manifest
      interval: 5s
      timeout: 3s
      retries: 5

ext_config:
  enable_document_access: false

usage: |
  ## 首次使用

  1. 打开应用首页，直接在页面上注册第一个账号
  2. 第一个账号自动成为管理员
  3. 注册成功后，凭据会自动保存
  4. 后续访问时，账号密码会自动填充

  ## Ollama 配置（可选）

  如果你已有 Ollama 实例，在部署参数中填写 `ollama_host` 地址。

  ## OAuth 配置（可选）

  如需启用 OAuth 登录，在部署参数中填写对应 Provider 的 Client ID 和 Secret。
